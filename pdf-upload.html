<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Upload | MKG Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#eef5ff,#fff);padding:20px}
.box{max-width:500px;margin:30px auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 10px 30px #0002;border:2px solid #ffd000}
h2{text-align:center;color:#063b70;margin-bottom:15px}
label{font-weight:bold;margin-top:15px;display:block;color:#123}
input,select{width:100%;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #ccc;background:#f8f8f8}
.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#075da0,#06366b);color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.status{margin-top:15px;text-align:center;font-weight:bold;min-height:20px}
.list{max-width:500px;margin:20px auto}
.item{background:#fff;padding:15px;border-radius:12px;margin-bottom:10px;box-shadow:0 5px 15px #0001;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="box">
<h2>📄 PDF Upload (Mobile से)</h2>
<label>Class Select करो</label>
<select id="className"><option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option><option value="10" selected>Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option></select>
<label>PDF का नाम / Title</label>
<input type="text" id="title" placeholder="Ex: Maths Chapter 1">
<label>Mobile से PDF चुनो</label>
<input type="file" id="pdfFile" accept=".pdf">
<button class="btn" onclick="uploadPDF()">⬆️ Upload PDF</button>
<div id="status" class="status"></div>
<a href="admin.html" style="display:block;text-align:center;margin-top:15px;text-decoration:none;color:#075da0;font-weight:bold;">⬅️ Back to Admin</a>
</div>
<div class="list" id="pdfList"></div>

<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const CLOUD_NAME="pa5iwcv8";
const PRESET="mkg_images";
const statusEl=document.getElementById("status");

window.uploadPDF=async function(){
 const file=document.getElementById("pdfFile").files[0];
 const className=document.getElementById("className").value;
 const title=document.getElementById("title").value;
 if(!file){ statusEl.style.color="red"; statusEl.textContent="❌ पहले PDF चुनो"; return; }
 if(!title){ statusEl.style.color="red"; statusEl.textContent="❌ Title लिखो"; return; }

 statusEl.style.color="#075da0"; statusEl.textContent="⏳ Upload हो रहा है... 1-2 मिनट लगेगा";

 try{
  const fd=new FormData(); fd.append("file",file); fd.append("upload_preset",PRESET);
  const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/raw/upload`,{method:"POST",body:fd});
  const data=await res.json();
  if(!res.ok) throw new Error(data.error?.message);
  const pdfUrl=data.secure_url;

  await addDoc(collection(db,"courses"),{
    className:className,
    class:className,
    title:title,
    description:title,
    pdfUrl:pdfUrl,
    videoUrl:"",
    active:true,
    status:"Active",
    createdAt:serverTimestamp()
  });

  statusEl.style.color="green"; statusEl.textContent="✅ हो गया! अब Courses में दिखेगा";
  loadPDFs();
 }catch(e){ statusEl.style.color="red"; statusEl.textContent="❌ Error: "+e.message; }
}

async function loadPDFs(){
 const snap=await getDocs(collection(db,"courses"));
 let html=""; snap.forEach(d=>{ const v=d.data(); html+=`<div class="item"><span>Class ${v.className} - ${v.title||v.description}</span><a href="${v.pdfUrl}" target="_blank">View</a></div>`});
 document.getElementById("pdfList").innerHTML=html;
}
loadPDFs();
</script>
</body>
</html>
