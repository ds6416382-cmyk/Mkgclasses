<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Login - MKG</title>
<style>
body{background:#0f0f0f;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif}
.box{background:#1a1a1a;padding:30px;border-radius:15px;width:90%;max-width:350px;text-align:center;border:1px solid #333}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;outline:none}
button{width:100%;padding:12px;background:#FFD700;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h2>👨‍🎓 Student Login</h2>
<input type="email" id="email" placeholder="Student Email / ID">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="msg" style="margin-top:15px;color:#ff6b6b"></p>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

document.getElementById("loginBtn").onclick = async ()=>{
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  msg.innerText = "Checking...";
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    msg.style.color = "#00ff88";
    msg.innerText = "Login Success! Redirecting...";
    setTimeout(()=>{ window.location.href = "courses.html"; }, 1000);
  }catch(e){
    msg.style.color = "#ff6b6b";
    msg.innerText = e.message;
  }
}
</script>
</body>
</html>
