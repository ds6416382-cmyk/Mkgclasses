<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Login</title>
<style>
body{background:#04101f;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif}
.box{background:#12264a;padding:30px;border-radius:15px;width:90%;max-width:350px;text-align:center;border:1px solid #ffffff20}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;outline:none}
button{width:100%;padding:12px;background:#FFD700;border:none;border-radius:8px;font-weight:bold;font-size:16px}
#msg{margin-top:12px;min-height:20px}
</style>
</head>
<body>
<div class="box">
<h2>Student Login</h2>
<input id="sid" placeholder="Student ID">
<input id="spass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>
<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
window.login = async ()=>{
  const id = document.getElementById("sid").value.trim();
  const pass = document.getElementById("spass").value.trim();
  const msg = document.getElementById("msg");
  if(!id||!pass){msg.innerText="ID Password डालो";return;}
  msg.innerText="Checking...";
  const snap = await getDocs(collection(db,"students"));
  let ok=false;
  snap.forEach(d=>{
    const s=d.data();
    if(s.studentId==id && s.password==pass) ok=true;
  });
  if(ok){
    localStorage.setItem("mkg_login","true");
    localStorage.setItem("mkg_student_id",id);
    msg.innerText="Success!";
    window.location.href="courses.html";
  }else{
    msg.innerText="ID या Password गलत है";
  }
}
</script>
</body>
</html>
