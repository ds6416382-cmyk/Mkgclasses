<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | MKG Coaching Classes</title>
<link rel="stylesheet" href="Style.css">
<style>
body{font-family:Poppins,sans-serif;background:#f5f7fb;margin:0;padding:20px;}
h1{text-align:center;color:#0b3d91;margin:20px 0;}
.card{max-width:600px;margin:20px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.12);text-align:center;}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:15px;max-width:600px;margin:20px auto;}
.menu a{ background:white; padding:20px; border-radius:12px; text-align:center; text-decoration:none; color:#0b3d91; font-weight:bold; box-shadow:0 5px 15px rgba(0,0,0,.12); }
.menu a:hover{background:#0b3d91;color:white;}
.logout{display:block;width:max-content;margin:30px auto;padding:12px 25px;background:#dc3545;color:white;text-decoration:none;border-radius:8px;font-weight:bold;}
</style>
</head>
<body>

<h1>🎓 Student Dashboard</h1>

<div class="card">
<h2 id="sName">👤 Student Name</h2>
<p><b>Student ID:</b> <span id="sId">MKG001</span></p>
<p><b>Class:</b> <span id="sClass">Loading...</span></p>
<p><b>Email:</b> <span id="sEmail">Loading...</span></p>
</div>

<div class="menu">
<a href="notes.html">📚 PDF Notes<br><small>और Video</small></a>
<a href="courses.html">📖 Courses</a>
<a href="gallery.html">🖼️ Gallery</a>
<a href="contact.html">📞 Contact Us</a>
</div>

<a href="#" id="logoutBtn" class="logout">🚪 Logout</a>
<a href="index.html" style="display:block;text-align:center;margin-top:15px;color:#0b3d91;">🏠 Home</a>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const sName = document.getElementById("sName");
const sClass = document.getElementById("sClass");
const sEmail = document.getElementById("sEmail");
const sId = document.getElementById("sId");

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    window.location.href="login.html";
    return;
  }
  sEmail.innerText = user.email;
  try{
    const snap = await getDoc(doc(db, "students", user.uid));
    if(snap.exists()){
      const data = snap.data();
      sName.innerText = "👤 " + (data.name || "Student");
      sClass.innerText = data.class || data.className || localStorage.getItem("studentClass") || "N/A";
      sId.innerText = data.studentId || user.uid.slice(0,6).toUpperCase();
      
      // अगर Rejected है तो Notes मत दिखाओ
      if((data.status||"").toLowerCase() === "rejected"){
        alert("❌ आपका Account Rejected है। Admin से संपर्क करो।");
      }
    }
  } catch(e){ console.log(e); }
});

document.getElementById("logoutBtn").onclick = async (e)=>{
  e.preventDefault();
  await signOut(auth);
  localStorage.clear();
  window.location.href="login.html";
};
</script>
</body>
</html>
