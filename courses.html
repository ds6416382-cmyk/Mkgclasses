<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Courses - MKG</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#04101f;color:#fff;padding:15px}.header{text-align:center;padding:20px}.header h1 span{color:#FFD700}.grid{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{background:#12264a;padding:20px;border-radius:15px;text-align:center;border:1px solid #ffffff20}.btn{padding:10px 15px;border-radius:8px;text-decoration:none;color:#fff;display:inline-block;margin:5px;font-weight:bold}.v{background:#e50914}.p{background:#07835e}.lock{max-width:500px;margin:80px auto;text-align:center;background:#12264a;padding:40px;border-radius:20px}</style></head><body><div class="header"><h1>MKG <span>COACHING</span></h1><p id="head">Checking...</p></div><div id="grid" class="grid"></div><script type="module">import{db}from"./firebase.js";import{collection,getDocs}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";const grid=document.getElementById("grid");const head=document.getElementById("head");if(localStorage.getItem("mkg_login")!=="true"){head.innerText="Login जरूरी है";grid.innerHTML=`<div class="lock"><div style="font-size:60px">🔒</div><h2>Login जरूरी है</h2><br><a href="student-login.html" style="background:#FFD700;color:#000;padding:12px 25px;border-radius:10px;text-decoration:none;font-weight:bold">Login करें</a></div>`;}else{head.innerHTML=`Welcome ${localStorage.getItem("mkg_student_id")} | <a href="#" onclick="localStorage.clear();location.href='student-login.html'" style="color:#FFD700">Logout</a>`;load();}async function load(){const snap=await getDocs(collection(db,"courses"));grid.innerHTML="";snap.forEach(d=>{const c=d.data();grid.innerHTML+=`<div class="card"><h2>Class ${c.className||c.class||""}</h2><p>${c.description||""}</p><div><a href="${c.videoUrl||"#"}" target="_blank" class="btn v">Video</a><a href="${c.pdfUrl||"#"}" target="_blank" class="btn p">PDF</a></div></div>`;});}</script></body></html>
